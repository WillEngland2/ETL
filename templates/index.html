<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETL Project</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f7f7f7;
    }
    .container {
      margin-top: 50px;
    }
    .card {
      margin-bottom: 20px;
    }
    .table-container {
      display: none; /* Hide table until processed files are available */
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Upload Form Card -->
    <div class="card">
      <div class="card-header">
        <h3>Upload File</h3>
      </div>
      <div class="card-body">
        <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
          <div class="form-group">
            <label for="file">Choose File</label>
            <input type="file" name="file" class="form-control-file" required>
          </div>
          <div class="form-group">
            <label for="output_name">Output File Name</label>
            <input type="text" name="output_name" class="form-control" placeholder="Enter file name" required>
          </div>
          <div class="form-group">
            <label for="epic_name">Epic Name</label>
            <input type="text" name="epic_name" class="form-control" placeholder="Enter epic name" required>
          </div>
          <div class="form-group">
            <label for="invoice_date">Invoice Date</label>
            <input type="date" name="invoice_date" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary">Submit Data</button>
        </form>
      </div>
    </div>

    <!-- Processed Files Table Card -->
    <div class="card table-container" id="resultsCard">
      <div class="card-header">
        <h3>Processed Files</h3>
      </div>
      <div class="card-body">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>File Name</th>
              <th>Download Link</th>
            </tr>
          </thead>
          <tbody id="filesTableBody">
            <!-- Rows will be added here dynamically after upload -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS and dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script>
    // Example JavaScript to handle the form submission and update the table with download links.
    // In a production app, you might want to use a more robust solution.
    $(document).ready(function(){
      $("#uploadForm").on("submit", function(e){
        e.preventDefault();
        var formData = new FormData(this);
        $.ajax({
          url: "/upload",
          type: "POST",
          data: formData,
          processData: false,
          contentType: false,
          success: function(response) {
            // Clear existing table rows
            $("#filesTableBody").empty();
            // Iterate over the returned files and add rows
            response.files.forEach(function(file) {
              var row = `<tr>
                <td>${file.name}</td>
                <td><a href="${file.file_url}" target="_blank">Download</a></td>
              </tr>`;
              $("#filesTableBody").append(row);
            });
            // Show the results card
            $("#resultsCard").show();
          },
          error: function(xhr, status, error) {
            alert("An error occurred: " + xhr.responseJSON.error);
          }
        });
      });
    });
  </script>
</body>
</html>

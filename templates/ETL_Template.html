<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ETL Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="card w-100" style="max-width: 500px;">
      <div class="card-body">
        <h4 class="card-title text-center mb-4">Upload a Spreadsheet</h4>
        <form action="/upload" method="POST" enctype="multipart/form-data">
          <div class="form-group">
            <label for="file">Select Excel File</label>
            <input type="file" name="file" class="form-control" accept=".xlsx,.xls" required>
          </div>
          <div class="form-group">
            <label for="output_name">Main Output Filename</label>
            <input type="text" name="output_name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="epic_name">Epic Output Name</label>
            <input type="text" name="epic_name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="invoice_date">Invoice Date</label>
            <input type="date" name="invoice_date" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Upload & Process</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
